<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ask the closet — aanu's closet</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="cursor"></div>

<nav class="cc-nav">
  <div class="cc-logo">aanu&apos;s <span class="wiggle">closet</span></div>
  <div class="cc-nav-links">
    <a href="index.html">closet</a>
    <a href="wishlist.html">wishlist</a>
    <a href="chat.html" class="active">ask the closet</a>
  </div>
</nav>

<header class="cc-hero" style="padding-bottom: 1rem;">
  <div class="cc-glyph">⁂</div>
  <h1>what's the <em>vibe</em>?</h1>
  <p>tell me the mood + what you're doing, i'll pin a fit from your actual closet.</p>
</header>

<div class="cc-note-banner">
  prototype mode: replies are simulated locally from your tagged pieces. see README for wiring
  this up to a real model via a server route.
</div>

<div class="cc-chat-wrap">
  <div class="cc-chat-log" id="chatLog"></div>
  <form class="cc-chat-form" id="chatForm">
    <input id="chatInput" type="text" placeholder="e.g. brunch with the girls, want to feel put together but not try-hard" autocomplete="off" />
    <button type="submit" class="cc-btn">send</button>
  </form>
</div>

<div class="cc-board-wrap">
  <div class="cc-board-label">⁂ today's board</div>
  <div class="cc-board" id="board"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>initCursor(); initChat();</script>
</body>
</html>
