//   closest free equivalents: Inter (sans) + Fraunces (serif).
// Colors: white/cream background, near-black text rgb(28,27,27)/rgb(40,43,48),
//   no brand accent color — palette is pure editorial neutral. The bright

// ─── CLIENT-SIDE BACKGROUND CUTOUT (free, real — no AI service required) ────
// Nicobar's product studio shots sit on a near-uniform grey/white seamless
// background. We flood-fill inward from the image border, matching pixels
// within a color-distance tolerance of the border color, so only the
// background (not similarly-toned highlights *inside* the product) gets
// cut. The mask is computed at low-res for speed, feathered with a box blur
// for a soft anti-aliased edge, then scaled back up over the full-res image.
const ROOM_PLACEMENT_IMAGE = {
  "Valley Vase": "https://www.nicobar.com/cdn/shop/files/NBI016416_1_1200x.jpg",
  "Indigo Plates": "https://www.nicobar.com/cdn/shop/files/NBI034645_6.jpg",
  "Taper Candles": "https://www.nicobar.com/cdn/shop/files/NBI034449_1_1200x.jpg",
  // Rattan Mirror has no clean-background shot on nicobar.com (always styled
  // against a textured wall) — it's rendered as a framed rectangle instead,
  // which reads naturally since mirrors are inherently flat & rectangular.
};

const cutoutCache = {};

function computeCutout(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const work = 360;
        const scale = Math.min(1, work / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const small = document.createElement("canvas");
        small.width = w; small.height = h;
        const sctx = small.getContext("2d");
        sctx.drawImage(img, 0, 0, w, h);
        const data = sctx.getImageData(0, 0, w, h);
        const px = data.data;

        // Adaptive neighbor-to-neighbor flood fill: each candidate pixel is
        // compared both to the color it's spreading FROM (lets the fill
        // follow a soft studio vignette/gradient) and to the overall border
        // average (caps total drift so soft contact-shadows can't act as a
        // bridge all the way into the product itself).
        let br = 0, bg = 0, bb = 0, n = 0;
        for (let x = 0; x < w; x++) {
          for (const y of [0, h - 1]) { const i = (y * w + x) * 4; br += px[i]; bg += px[i+1]; bb += px[i+2]; n++; }
        }
        for (let y = 0; y < h; y++) {
          for (const x of [0, w - 1]) { const i = (y * w + x) * 4; br += px[i]; bg += px[i+1]; bb += px[i+2]; n++; }
        }
        br /= n; bg /= n; bb /= n;

        const stepTolerance = 16;
        const globalTolerance = 60;
        const mask = new Uint8Array(w * h);
        const visited = new Uint8Array(w * h);
        const stack = [];
        const pushSeed = (i) => stack.push([i, px[i*4], px[i*4+1], px[i*4+2]]);
        for (let x = 0; x < w; x++) { pushSeed(x); pushSeed((h - 1) * w + x); }
        for (let y = 0; y < h; y++) { pushSeed(y * w); pushSeed(y * w + (w - 1)); }

        while (stack.length) {
          const [i, refR, refG, refB] = stack.pop();
          if (visited[i]) continue;
          const o = i * 4;
          const dr = px[o] - refR, dg = px[o+1] - refG, db = px[o+2] - refB;
          if (Math.sqrt(dr*dr + dg*dg + db*db) > stepTolerance) continue;
          const gdr = px[o] - br, gdg = px[o+1] - bg, gdb = px[o+2] - bb;
          if (Math.sqrt(gdr*gdr + gdg*gdg + gdb*gdb) > globalTolerance) continue;
          visited[i] = 1;
          mask[i] = 1;
          const x = i % w, y = (i / w) | 0;
          const cr = px[o], cg = px[o+1], cb = px[o+2];
          if (x > 0 && !visited[i - 1]) stack.push([i - 1, cr, cg, cb]);
          if (x < w - 1 && !visited[i + 1]) stack.push([i + 1, cr, cg, cb]);
          if (y > 0 && !visited[i - w]) stack.push([i - w, cr, cg, cb]);
          if (y < h - 1 && !visited[i + w]) stack.push([i + w, cr, cg, cb]);
        }

        // feather: box blur the mask a couple passes so edges aren't jagged
        let alpha = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) alpha[i] = mask[i] ? 0 : 255;
        for (let pass = 0; pass < 2; pass++) {
          const next = new Float32Array(w * h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              let sum = 0, cnt = 0;
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  const nx = x + dx, ny = y + dy;
                  if (nx >= 0 && nx < w && ny >= 0 && ny < h) { sum += alpha[ny * w + nx]; cnt++; }
                }
              }
              next[y * w + x] = sum / cnt;
            }
          }
          alpha = next;
        }

        const maskCanvas = document.createElement("canvas");
        maskCanvas.width = w; maskCanvas.height = h;
        const mctx = maskCanvas.getContext("2d");
        const maskData = mctx.createImageData(w, h);
        for (let i = 0; i < w * h; i++) {
          maskData.data[i*4] = 0; maskData.data[i*4+1] = 0; maskData.data[i*4+2] = 0;
          maskData.data[i*4+3] = alpha[i];
        }
        mctx.putImageData(maskData, 0, 0);

        const full = document.createElement("canvas");
        full.width = img.naturalWidth; full.height = img.naturalHeight;
        const fctx = full.getContext("2d");
        fctx.drawImage(img, 0, 0);
        const fullData = fctx.getImageData(0, 0, full.width, full.height);

        const maskUpscale = document.createElement("canvas");
        maskUpscale.width = full.width; maskUpscale.height = full.height;
        const muCtx = maskUpscale.getContext("2d");
        muCtx.imageSmoothingEnabled = true;
        muCtx.drawImage(maskCanvas, 0, 0, full.width, full.height);
        const maskFullData = muCtx.getImageData(0, 0, full.width, full.height);

        for (let i = 0; i < full.width * full.height; i++) {
          fullData.data[i*4+3] = maskFullData.data[i*4+3];
        }
        fctx.putImageData(fullData, 0, 0);
        resolve(full.toDataURL("image/png"));
      } catch (err) {
        resolve(url);
      }
    };
    img.onerror = () => resolve(url);
    img.src = url;
  });
}

function getCutout(piece) {
  const src = ROOM_PLACEMENT_IMAGE[piece];
  if (!src) return Promise.resolve(null);
  if (!cutoutCache[piece]) cutoutCache[piece] = computeCutout(src);
  return cutoutCache[piece];
}

// ─── PLACED PIECE SIZES (approximate real-world proportions, for AR realism) ─
const PLACED_SIZE = {
  "Valley Vase": { w: 44, h: 74 },
  "Indigo Plates": { w: 88, h: 62 },
  "Taper Candles": { w: 92, h: 54 },
  "Rattan Mirror": { w: 56, h: 76 },
};

// ─── PLACED PIECE (draggable cutout + contact shadow, for realistic AR feel) ─
const PlacedPiece = ({ p, onDragStart, onDragMove, onDragEnd, onRemove }) => {
  const size = PLACED_SIZE[p.piece] || { w: 64, h: 64 };
  const [cutout, setCutout] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let live = true;
    getCutout(p.piece).then((src) => { if (live) { setCutout(src); setReady(true); } });
    return () => { live = false; };
  }, [p.piece]);

  const hasCutout = ready && cutout;
  // No clean-background source (e.g. Rattan Mirror) — render as a small
  // framed rectangle instead, which reads naturally since the object itself
  // is flat and rectangular.
  const isFramed = ready && !cutout;

  return (
    <div
      onPointerDown={(e) => { e.stopPropagation(); e.target.setPointerCapture(e.pointerId); onDragStart(p.id); }}
      onPointerMove={(e) => { e.stopPropagation(); onDragMove(e); }}
      onPointerUp={(e) => { e.stopPropagation(); onDragEnd(); }}
      style={{
        position: "absolute", left: `${p.x}%`, top: `${p.y}%`, transform: "translate(-50%, -50%)",
        width: size.w, cursor: "grab", touchAction: "none", userSelect: "none",
        opacity: ready ? 1 : 0, transition: "opacity 0.25s ease, transform 0.2s ease",
      }}
    >
      {/* contact shadow — grounds the piece on the surface */}
      <div
        style={{
          position: "absolute", bottom: isFramed ? -3 : -4, left: "50%", transform: "translateX(-50%)",
          width: size.w * (isFramed ? 0.7 : 0.8), height: isFramed ? 7 : 10, borderRadius: "50%",
          background: "radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 72%)",
          filter: "blur(1.5px)", zIndex: 0,
        }}
      />
      {isFramed ? (
        <div style={{ position: "relative", zIndex: 1, width: size.w, height: size.h, background: N.white, padding: 3, boxShadow: "0 8px 16px rgba(0,0,0,0.35)", borderRadius: 3 }}>
          <img src={PHOTO_LIBRARY[p.piece]} alt={p.piece} draggable={false} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", borderRadius: 1 }} />
        </div>
      ) : (
        <img
          src={hasCutout ? cutout : PHOTO_LIBRARY[p.piece]}
          alt={p.piece}
          draggable={false}
          style={{
            position: "relative", zIndex: 1, width: size.w, height: size.h, objectFit: "contain",
            filter: "drop-shadow(0 8px 8px rgba(0,0,0,0.4))", display: "block", pointerEvents: "none",
          }}
        />
      )}
      <button
        onClick={(ev) => onRemove(p.id, ev)}
        onPointerDown={(ev) => ev.stopPropagation()}
        title="Remove"
        style={{
          position: "absolute", top: -8, right: -8, width: 20, height: 20, borderRadius: "50%",
          background: "rgba(255,255,255,0.95)", border: "1px solid rgba(0,0,0,0.15)", color: "#1c1b1b",
          fontSize: 12, lineHeight: "18px", padding: 0, cursor: "pointer", zIndex: 2,
          boxShadow: "0 2px 6px rgba(0,0,0,0.25)",
        }}
      >
        ×
      </button>
    </div>
  );
};

// ─── PLACEHOLDER IMAGE COMPONENT ────────────────────────────────────────────
const Placeholder = ({ w, h, label = "", style = {}, aspect }) => {
  const photo = PHOTO_LIBRARY[label];
  if (photo) {
    return (
      <img
        src={photo}
        alt={label}
        style={{
          width: w || "100%",
          height: h,
          aspectRatio: aspect,
          objectFit: "cover",
          flexShrink: 0,
          display: "block",
          ...style,
        }}
      />
    );
  }
  return (
    <div
      style={{
        width: w || "100%",
        height: h,
        aspectRatio: aspect,
        background: N.grey6,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        flexShrink: 0,
        ...style,
      }}
    >
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={N.grey3} strokeWidth="1.2">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      {label && (
        <span style={{ fontSize: 9, color: N.grey3, marginTop: 5, letterSpacing: "0.08em", textTransform: "uppercase", textAlign: "center", padding: "0 8px" }}>
          {label}
        </span>
      )}
    </div>
  );
};

// Real wordmark: thin geometric sans, wide tracking — the "O" in NICOBAR is
// replaced by a small circle sitting on a wave squiggle (an ocean motif).
const NicobarLogo = ({ size = 18, color = N.black }) => {
  const dot = size * 0.62;
  return (
    <span
      style={{
        display: "inline-flex", alignItems: "center",
        fontFamily: "'Inter', sans-serif", fontWeight: 300, fontSize: size,
        letterSpacing: "0.18em", color, textTransform: "uppercase", userSelect: "none",
      }}
    >
      NIC
      <span style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: dot, margin: `0 ${size * 0.06}px` }}>
        <span style={{ width: dot * 0.7, height: dot * 0.7, borderRadius: "50%", border: `${Math.max(1, size * 0.07)}px solid ${color}`, marginBottom: dot * 0.1 }} />
        <svg width={dot * 0.85} height={dot * 0.32} viewBox="0 0 20 8">
          <path d="M1 4 Q5 0.5 10 4 T19 4" fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      </span>
      BAR
    </span>
  );
};

// ─── STYLE BRIEF (derived from the tags on liked pieces after a swipe run) ──
const STYLE_PROFILES = [
  { tag: "Terracotta", title: "Warm & Earthy", blurb: "Terracotta and hand-thrown texture kept catching your eye — you like a table that feels grounded, sun-baked, a little imperfect." },
  { tag: "Brass", title: "Moody & Ambient", blurb: "Brass and soft firelight came up again and again — you're building a room that glows after dark." },
  { tag: "Rattan", title: "Textured & Natural", blurb: "Rattan and woven texture stood out — natural materials, a relaxed, layered feel." },
  { tag: "Block print", title: "Pattern-Forward", blurb: "Bold block-printed pattern caught your eye — you like a table that makes a statement." },
  { tag: "Hand-glazed", title: "Handmade & Tactile", blurb: "Hand-glazed, one-of-a-kind pieces are your thing — nothing that looks mass-produced." },
];

function getStyleBrief(liked) {
  const fallback = { title: "Eclectic Explorer", blurb: "You kept an open mind across the board — a little bit of everything caught your interest.", tags: [] };
  if (liked.length === 0) return fallback;
  const counts = {};
  liked.forEach((p) => p.tags.forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
  const topTags = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([t]) => t);
  const profile = STYLE_PROFILES.find((sp) => counts[sp.tag] > 0);
  if (!profile) return { ...fallback, tags: topTags };
  return { title: profile.title, blurb: profile.blurb, tags: topTags };
}

// ─── SWIPE DECK (Tinder-style like / skip for taste-based recommendations) ──
const SwipeDeck = ({ go, cardW = 300, cardH = 380 }) => {
  const [index, setIndex] = useState(0);
  const [drag, setDrag] = useState({ dragging: false, startX: 0, dx: 0 });
  const [liked, setLiked] = useState([]);
  const [passed, setPassed] = useState([]);

  const deck = PRODUCTS;
  const done = index >= deck.length;

  const commit = (direction) => {
    const item = deck[index];
    if (direction === "like") setLiked((l) => [...l, item]);
    else setPassed((p) => [...p, item]);
    setDrag({ dragging: false, startX: 0, dx: 0 });
    setIndex((i) => i + 1);
  };

  const onDown = (e) => {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setDrag({ dragging: true, startX: x, dx: 0 });
  };
  const onMove = (e) => {
    if (!drag.dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setDrag((d) => ({ ...d, dx: x - d.startX }));
  };
  const onUp = () => {
    if (!drag.dragging) return;
    if (drag.dx > 90) commit("like");
    else if (drag.dx < -90) commit("dislike");
    else setDrag({ dragging: false, startX: 0, dx: 0 });
  };

  const recommendations = () => {
    if (liked.length === 0) return deck.slice(0, 4);
    const likedTags = new Set(liked.flatMap((p) => p.tags));
    return deck
      .filter((p) => !liked.includes(p) && p.tags.some((t) => likedTags.has(t)))
      .slice(0, 4);
  };

  if (done) {
    const recs = recommendations();
    const brief = getStyleBrief(liked);
    return (
      <div style={{ padding: "8px 16px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: N.grey2, marginBottom: 4 }}>You liked {liked.length} of {deck.length}</div>

        <div style={{ border: `1px solid ${N.grey4}`, background: N.grey5, padding: "18px 18px 16px", margin: "10px 0 20px", textAlign: "left" }}>
          <div style={{ fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase", color: N.grey2, marginBottom: 8 }}>Your style</div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 24, color: N.black, marginBottom: 8 }}>{brief.title}</div>
          <p style={{ fontSize: 12, color: N.grey1, lineHeight: 1.75, letterSpacing: "0.02em", marginBottom: brief.tags.length ? 12 : 0 }}>{brief.blurb}</p>
          {brief.tags.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {brief.tags.map((t) => (
                <span key={t} style={{ fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", border: `0.5px solid ${N.grey3}`, padding: "4px 9px", color: N.grey1 }}>{t}</span>
              ))}
            </div>
          )}
        </div>

        <p style={{ fontSize: 11, color: N.grey1, lineHeight: 1.7, marginBottom: 18 }}>Here's what we'd recommend based on your style</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, textAlign: "left" }}>
          {recs.map((p) => (
            <div key={p.name} onClick={() => go("product")} style={{ cursor: "pointer" }}>
              <Placeholder aspect="1/1" label={p.name} />
              <div style={{ fontSize: 11, color: N.black, marginTop: 6 }}>{p.name}</div>
              <div style={{ fontSize: 10, color: N.grey2, marginTop: 2 }}>₹{p.price.toLocaleString("en-IN")}</div>
            </div>
          ))}
        </div>
        <BtnPrimary style={{ marginTop: 18 }} onClick={() => go("discover")}>Explore curated looks</BtnPrimary>
        <BtnOutline style={{ marginTop: 10 }} onClick={() => { setIndex(0); setLiked([]); setPassed([]); }}>Swipe again</BtnOutline>
      </div>
    );
  }

  const rotate = drag.dx / 18;
  const likeOpacity = Math.min(Math.max(drag.dx / 90, 0), 1);
  const passOpacity = Math.min(Math.max(-drag.dx / 90, 0), 1);

  return (
    <div style={{ padding: "8px 16px 24px" }}>
      <div style={{ textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20 }}>Swipe for your style</div>
        <div style={{ fontSize: 10, color: N.grey2, marginTop: 2 }}>{index + 1} of {deck.length} · Swipe right to like, left to skip</div>
      </div>
      <div style={{ position: "relative", width: cardW, height: cardH, margin: "0 auto" }}>
        {deck.slice(index, index + 3).reverse().map((p, revI) => {
          const stackI = deck.slice(index, index + 3).length - 1 - revI;
          const isTop = stackI === 0;
          return (
            <div
              key={p.name}
              onMouseDown={isTop ? onDown : undefined}
              onMouseMove={isTop ? onMove : undefined}
              onMouseUp={isTop ? onUp : undefined}
              onMouseLeave={isTop ? onUp : undefined}
              onTouchStart={isTop ? onDown : undefined}
              onTouchMove={isTop ? onMove : undefined}
              onTouchEnd={isTop ? onUp : undefined}
              style={{
                position: "absolute", inset: 0,
                transform: isTop
                  ? `translateX(${drag.dx}px) rotate(${rotate}deg)`
                  : `scale(${1 - stackI * 0.04}) translateY(${stackI * 10}px)`,
                transition: drag.dragging ? "none" : "transform 0.25s ease",
                cursor: isTop ? "grab" : "default",
                zIndex: 10 - stackI,
                touchAction: "none",
              }}
            >
              <div style={{ position: "relative", width: "100%", height: "100%", background: N.white, border: `1px solid ${N.grey4}`, overflow: "hidden" }}>
                <Placeholder w="100%" h="72%" label={p.name} />
                <div style={{ padding: 14 }}>

const RoomScreen = ({ go }) => {
  const [sel, setSel] = useState("Valley Vase");
  const [roomPhoto, setRoomPhoto] = useState(null);
  const [placed, setPlaced] = useState([]);
  const [draggingId, setDraggingId] = useState(null);
  const fileInputRef = useRef(null);
  const photoBoxRef = useRef(null);
  const pieces = ["Valley Vase", "Indigo Plates", "Taper Candles", "Rattan Mirror"];

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setRoomPhoto(url);
    setPlaced([]);
  };

  const onPhotoClick = (e) => {
    if (!roomPhoto) { fileInputRef.current && fileInputRef.current.click(); return; }
    const rect = e.currentTarget.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width) * 100;
    const yPct = ((e.clientY - rect.top) / rect.height) * 100;
    setPlaced((list) => [...list, { id: Date.now(), piece: sel, x: xPct, y: yPct }]);
  };

  const onDragMove = (e) => {
    if (draggingId == null || !photoBoxRef.current) return;
    const rect = photoBoxRef.current.getBoundingClientRect();
    const xPct = Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.min(100, Math.max(0, ((e.clientY - rect.top) / rect.height) * 100));
    setPlaced((list) => list.map((p) => (p.id === draggingId ? { ...p, x: xPct, y: yPct } : p)));
  };

  const removePlaced = (id, ev) => {
    ev.stopPropagation();
    setPlaced((list) => list.filter((p) => p.id !== id));
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={onFile} />
      <TopNav
        left={<Icon name="arrow-left" size={18} onClick={() => go("discover")} />}
        center={<span style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase" }}>My Room</span>}
        right={<Icon name="camera" size={18} onClick={() => fileInputRef.current && fileInputRef.current.click()} />}
      />
      <Scroll>
        <div style={{ padding: "16px 16px 0" }}>
          <SectionLabel>Your space</SectionLabel>
          <div style={{ border: `1px solid ${N.grey4}`, padding: 12, marginBottom: 18, background: N.grey5 }}>
            <div style={{ fontSize: 9, letterSpacing: "0.16em", textTransform: "uppercase", color: N.grey2, marginBottom: 8 }}>Living room — uploaded photo</div>
            <div
              ref={photoBoxRef}
              onClick={onPhotoClick}
              style={{ position: "relative", width: "100%", height: 220, cursor: "pointer", overflow: "hidden", background: N.grey6 }}
            >
              {roomPhoto ? (
                <img src={roomPhoto} alt="Your room" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
              ) : (
                <Placeholder w="100%" h="100%" label="Your room photo will appear here — tap to place pieces" />
              )}
              {placed.map((p) => (
                <PlacedPiece
                  key={p.id}
                  p={p}
                  onDragStart={setDraggingId}
                  onDragMove={onDragMove}
                  onDragEnd={() => setDraggingId(null)}
                  onRemove={removePlaced}
                />
              ))}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              {["Retake", "Upload new"].map(l => (
                <button key={l} onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ padding: "7px 12px", border: `1px solid ${N.grey4}`, background: N.white, fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", fontFamily: "'Inter', sans-serif", color: N.grey1, display: "flex", alignItems: "center", gap: 5 }}>
                  <Icon name={l === "Retake" ? "camera" : "upload"} size={11} color={N.grey2} /> {l}
                </button>
              ))}
            </div>
          </div>

          <SectionLabel>Place a piece</SectionLabel>
          <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 14 }}>
            {pieces.map(p => (
              <div key={p} onClick={() => setSel(p)} style={{ flexShrink: 0, width: 80, border: `1px solid ${sel === p ? N.black : N.grey4}`, cursor: "pointer" }}>
                <Placeholder w={80} h={72} label={p} />
                <div style={{ padding: "5px 6px", fontSize: 9, color: N.black, letterSpacing: "0.04em", lineHeight: 1.3 }}>{p}</div>
              </div>
            ))}
          </div>

          <p style={{ fontSize: 12, color: N.grey1, lineHeight: 1.7, letterSpacing: "0.02em", marginBottom: 14 }}>
            {roomPhoto ? (
              <><strong style={{ fontWeight: 500, color: N.black }}>{sel}</strong> selected — tap your room photo above to place it. {placed.length > 0 ? `${placed.length} placed — drag to reposition, or tap × to remove.` : ""}</>
            ) : (
              <><strong style={{ fontWeight: 500, color: N.black }}>{sel}</strong> selected — tap the box above to upload a photo of your room, then tap on it to place this piece.</>
            )}
          </p>

          <div style={{ border: `1px solid ${N.grey4}`, padding: "12px 14px", marginBottom: 16, background: N.grey5 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase", color: N.grey2 }}>Decor harmony</span>
              <span style={{ fontSize: 12, fontWeight: 500, color: N.black }}>92%</span>
            </div>
            <div style={{ height: 3, background: N.grey4, marginBottom: 10 }}>
              <div style={{ width: "92%", height: "100%", background: N.black }} />
            </div>
            <p style={{ fontSize: 11, color: N.grey1, lineHeight: 1.7, letterSpacing: "0.02em" }}>
              Warm tones in your living room pair naturally with this piece — a grounded addition to the corner shelf.
            </p>
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
            <BtnPrimary onClick={() => go("cart")} style={{ flex: 1 }}>Add to bag</BtnPrimary>
            <BtnOutline onClick={() => go("wishlist")} style={{ flex: 1, marginTop: 0 }}>Wishlist</BtnOutline>
          </div>
        </div>
      </Scroll>
      <BottomBar active="room" go={go} />
    </div>
  );
};

              onClick={() => go(s)}
              style={{
                padding: "5px 10px", fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase",
                border: `1px solid ${screen === s ? "#1a1a1a" : "#ccc"}`,
                background: screen === s ? "#1a1a1a" : "#fff",
                color: screen === s ? "#fff" : "#666",
