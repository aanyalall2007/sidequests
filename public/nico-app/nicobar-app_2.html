<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nicobar Home — App Prototype</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/plain" id="app-source">
const { useState } = React;

// ─── DESIGN TOKENS (from nicobar.com inspection) ───────────────────────────
// Font: Futura PT (sans), Cormorant Garamond (serif) — via Google Fonts proxy
// Colors: white background, near-black text #1a1a1a, accent none (pure editorial)
// Logo font: custom — replicated via letter-spacing + Cormorant Garamond
// Nav: uppercase, 11px, letter-spacing 0.14em, font-weight 500
// Buttons: all-caps, no border-radius, solid black fill or outlined
// Product names: 13px, weight 400
// Prices: 13px, weight 400
// Section headings: uppercase, 10px, letter-spacing 0.2em

const FONT_URL =
  "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap";

// Nicobar exact palette from site inspection
const N = {
  white: "#FFFFFF",
  bg: "#FFFFFF",
  black: "#1a1a1a",
  grey1: "#4a4a4a",   // body text secondary
  grey2: "#888888",   // captions, labels
  grey3: "#bbbbbb",   // borders, dividers
  grey4: "#e8e8e8",   // light borders
  grey5: "#f5f5f5",   // very light bg / chips
  grey6: "#f0f0f0",   // placeholder image bg
  cream: "#faf7f2",   // their off-white background
  creamDark: "#f0ebe1", // slightly darker cream
  accent: "#1a1a1a",  // no brand accent color — pure B&W
};

const globalStyle = `
@import url('${FONT_URL}');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; background: #e8e4de; }
input, button, select, textarea { font-family: 'Jost', sans-serif; }
button { cursor: pointer; }
::-webkit-scrollbar { display: none; }
`;

// ─── PLACEHOLDER IMAGE COMPONENT ────────────────────────────────────────────
const Placeholder = ({ w, h, label = "", style = {}, aspect }) => (
  <div
    style={{
      width: w || "100%",
      height: h,
      aspectRatio: aspect,
      background: N.grey6,
      display: "flex",
      flexDirection: "column",
      alignItems: "center",
      justifyContent: "center",
      flexShrink: 0,
      ...style,
    }}
  >
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={N.grey3} strokeWidth="1.2">
      <rect x="3" y="3" width="18" height="18" rx="1"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    {label && (
      <span style={{ fontSize: 9, color: N.grey3, marginTop: 5, letterSpacing: "0.08em", textTransform: "uppercase", textAlign: "center", padding: "0 8px" }}>
        {label}
      </span>
    )}
  </div>
);

// ─── NICOBAR LOGO ────────────────────────────────────────────────────────────
const NicobarLogo = ({ size = 18, color = N.black }) => (
  <span
    style={{
      fontFamily: "'Cormorant Garamond', serif",
      fontSize: size,
      fontWeight: 400,
      letterSpacing: "0.22em",
      color,
      textTransform: "uppercase",
      userSelect: "none",
    }}
  >
    Nicobar
  </span>
);

// ─── PHONE SHELL ─────────────────────────────────────────────────────────────
const Phone = ({ children }) => (
  <div
    style={{
      width: 375,
      height: 812,
      background: N.white,
      borderRadius: 44,
      border: "10px solid #111",
      boxShadow: "0 0 0 1.5px #2a2a2a, 0 32px 80px rgba(0,0,0,0.45), inset 0 0 0 1px #333",
      overflow: "hidden",
      display: "flex",
      flexDirection: "column",
      position: "relative",
    }}
  >
    {/* Dynamic Island */}
    <div style={{ height: 48, background: N.white, display: "flex", alignItems: "flex-end", justifyContent: "center", paddingBottom: 6, flexShrink: 0 }}>
      <div style={{ width: 120, height: 34, background: "#111", borderRadius: 20, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <div style={{ width: 12, height: 12, borderRadius: "50%", background: "#1a1a1a", border: "1.5px solid #2a2a2a" }} />
        <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#1c1c1c" }} />
      </div>
    </div>
    {children}
  </div>
);

// ─── STATUS BAR ──────────────────────────────────────────────────────────────
const StatusBar = () => (
  <div style={{ height: 0 }} />
);

// ─── TOP NAV ─────────────────────────────────────────────────────────────────
const TopNav = ({ left, center, right }) => (
  <div
    style={{
      height: 52,
      display: "flex",
      alignItems: "center",
      justifyContent: "space-between",
      padding: "0 16px",
      borderBottom: `0.5px solid ${N.grey4}`,
      background: N.white,
      flexShrink: 0,
      zIndex: 10,
    }}
  >
    <div style={{ width: 48, display: "flex", alignItems: "center" }}>{left}</div>
    <div style={{ flex: 1, display: "flex", justifyContent: "center" }}>{center}</div>
    <div style={{ width: 48, display: "flex", alignItems: "center", justifyContent: "flex-end" }}>{right}</div>
  </div>
);

// ─── ICON ────────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 20, color = N.black, onClick, style = {} }) => {
  const paths = {
    "arrow-left": <polyline points="15 18 9 12 15 6"/>,
    "menu": <><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></>,
    "bag": <><path d="M6 2 L3 6 v14 a2 2 0 0 0 2 2 h14 a2 2 0 0 0 2-2 V6 l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>,
    "heart": <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>,
    "search": <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    "share": <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></>,
    "camera": <><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>,
    "map-pin": <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>,
    "check": <polyline points="20 6 9 17 4 12"/>,
    "star": <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
    "trash": <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>,
    "gift": <><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></>,
    "sparkle": <><path d="M12 3 L13.5 9 L20 9 L14.5 13 L16.5 20 L12 16 L7.5 20 L9.5 13 L4 9 L10.5 9 Z"/></>,
    "home": <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
    "user": <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    "minus": <line x1="5" y1="12" x2="19" y2="12"/>,
    "plus": <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    "chevron-right": <polyline points="9 18 15 12 9 6"/>,
    "chevron-down": <polyline points="6 9 12 15 18 9"/>,
    "upload": <><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></>,
    "google": <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>,
  };
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
      onClick={onClick} style={{ cursor: onClick ? "pointer" : "default", flexShrink: 0, ...style }}
    >
      {paths[name]}
    </svg>
  );
};

// ─── BOTTOM TAB BAR ──────────────────────────────────────────────────────────
const BottomBar = ({ active, go }) => {
  const tabs = [
    { id: "discover", label: "Discover", icon: "sparkle" },
    { id: "room", label: "My Room", icon: "home" },
    { id: "wishlist", label: "Wishlist", icon: "heart" },
    { id: "profile", label: "Profile", icon: "user" },
  ];
  return (
    <div style={{ height: 64, display: "flex", borderTop: `0.5px solid ${N.grey4}`, background: N.white, flexShrink: 0 }}>
      {tabs.map((t) => (
        <button
          key={t.id}
          onClick={() => go(t.id)}
          style={{
            flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
            justifyContent: "center", gap: 4, background: "transparent", border: "none",
            color: active === t.id ? N.black : N.grey3,
          }}
        >
          <Icon name={t.icon} size={20} color={active === t.id ? N.black : N.grey3} />
          <span style={{ fontSize: 8, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: active === t.id ? 500 : 400 }}>{t.label}</span>
        </button>
      ))}
    </div>
  );
};

// ─── SCROLLABLE CONTENT WRAPPER ───────────────────────────────────────────────
const Scroll = ({ children, style = {} }) => (
  <div style={{ flex: 1, overflowY: "auto", overflowX: "hidden", ...style }}>{children}</div>
);

// ─── ANNOUNCEMENT BANNER ──────────────────────────────────────────────────────
const Banner = ({ text }) => (
  <div style={{ background: N.black, color: N.white, textAlign: "center", padding: "8px 16px", fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", flexShrink: 0 }}>
    {text}
  </div>
);

// ─── BUTTON COMPONENTS ────────────────────────────────────────────────────────
const BtnPrimary = ({ children, onClick, style = {} }) => (
  <button
    onClick={onClick}
    style={{
      width: "100%", padding: "14px 16px", background: N.black, color: N.white,
      border: "none", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase",
      fontWeight: 500, fontFamily: "'Jost', sans-serif", ...style,
    }}
  >
    {children}
  </button>
);

const BtnOutline = ({ children, onClick, style = {} }) => (
  <button
    onClick={onClick}
    style={{
      width: "100%", padding: "13px 16px", background: N.white, color: N.black,
      border: `1px solid ${N.black}`, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase",
      fontWeight: 500, fontFamily: "'Jost', sans-serif", ...style,
    }}
  >
    {children}
  </button>
);

// ─── INPUT ────────────────────────────────────────────────────────────────────
const Input = ({ label, ...props }) => (
  <div style={{ marginBottom: 14 }}>
    {label && <div style={{ fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase", color: N.grey2, marginBottom: 6 }}>{label}</div>}
    <input
      {...props}
      style={{
        width: "100%", padding: "13px 14px", border: `1px solid ${N.grey4}`,
        fontSize: 13, color: N.black, outline: "none", background: N.white,
        fontFamily: "'Jost', sans-serif", letterSpacing: "0.02em",
      }}
    />
  </div>
);

// ─── SECTION LABEL ────────────────────────────────────────────────────────────
const SectionLabel = ({ children, style = {} }) => (
  <div style={{ fontSize: 9, letterSpacing: "0.2em", textTransform: "uppercase", color: N.grey2, marginBottom: 12, ...style }}>
    {children}
  </div>
);

// ─── DIVIDER ─────────────────────────────────────────────────────────────────
const Divider = ({ label }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "18px 0" }}>
    <div style={{ flex: 1, height: 1, background: N.grey4 }} />
    {label && <span style={{ fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase", color: N.grey2 }}>{label}</span>}
    <div style={{ flex: 1, height: 1, background: N.grey4 }} />
  </div>
);

// ─── OTP BOXES ────────────────────────────────────────────────────────────────
const OtpBoxes = ({ values = ["8", "4", "2", ""] }) => (
  <div style={{ display: "flex", gap: 10, justifyContent: "center", margin: "24px 0" }}>
    {values.map((v, i) => (
      <div key={i} style={{
        width: 60, height: 64, border: `1px solid ${v ? N.black : N.grey4}`,
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: "'Cormorant Garamond', serif", fontSize: 28, color: N.black,
        background: v ? N.white : N.grey5,
      }}>
        {v}
      </div>
    ))}
  </div>
);

// ─── PRODUCT CARD ─────────────────────────────────────────────────────────────
const ProductCard = ({ name, sub, price, onClick, aspect = "3/4" }) => (
  <div onClick={onClick} style={{ cursor: "pointer" }}>
    <Placeholder aspect={aspect} label={name} />
    <div style={{ padding: "10px 0 14px" }}>
      <div style={{ fontSize: 12, color: N.black, letterSpacing: "0.02em" }}>{name}</div>
      {sub && <div style={{ fontSize: 11, color: N.grey2, marginTop: 2, letterSpacing: "0.02em" }}>{sub}</div>}
      <div style={{ fontSize: 12, color: N.black, marginTop: 6, letterSpacing: "0.02em" }}>₹{price}</div>
    </div>
  </div>
);

// ─── CHIP FILTER ──────────────────────────────────────────────────────────────
const ChipFilter = ({ options, active, onChange }) => (
  <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 2, marginBottom: 16 }}>
    {options.map((o) => (
      <button
        key={o}
        onClick={() => onChange(o)}
        style={{
          flexShrink: 0, padding: "7px 14px",
          border: `1px solid ${active === o ? N.black : N.grey4}`,
          background: active === o ? N.black : N.white,
          color: active === o ? N.white : N.grey1,
          fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase",
          fontFamily: "'Jost', sans-serif",
        }}
      >
        {o}
      </button>
    ))}
  </div>
);

// ─── STEP PROGRESS ────────────────────────────────────────────────────────────
const StepProgress = ({ current }) => (
  <div style={{ display: "flex", alignItems: "center", margin: "0 0 20px" }}>
    {["Cart", "Address & Payment", "Confirmed"].map((s, i) => (
      <div key={i} style={{ display: "flex", alignItems: "center", flex: i < 2 ? 1 : 0 }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <div style={{
            width: 24, height: 24, borderRadius: "50%",
            background: i < current ? N.black : i === current ? N.black : N.white,
            border: i >= current ? `1px solid ${i === current ? N.black : N.grey4}` : "none",
            display: "flex", alignItems: "center", justifyContent: "center",
            color: i <= current ? N.white : N.grey3, fontSize: 10, fontWeight: 500,
          }}>
            {i < current ? <Icon name="check" size={12} color={N.white} /> : <span>{i + 1}</span>}
          </div>
          <span style={{ fontSize: 8, letterSpacing: "0.08em", textTransform: "uppercase", color: i <= current ? N.black : N.grey3, whiteSpace: "nowrap" }}>{s}</span>
        </div>
        {i < 2 && <div style={{ flex: 1, height: 1, background: i < current ? N.black : N.grey4, margin: "0 8px", marginBottom: 18 }} />}
      </div>
    ))}
  </div>
);

// ─── MAKER QUOTE CARD ─────────────────────────────────────────────────────────
const MakerCard = ({ name, role, location, quote, go }) => (
  <div
    onClick={() => go("maker")}
    style={{ border: `1px solid ${N.grey4}`, padding: 16, marginTop: 20, cursor: "pointer" }}
  >
    <SectionLabel>From the maker</SectionLabel>
    <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
      <Placeholder w={44} h={44} style={{ borderRadius: "50%", flexShrink: 0 }} />
      <div>
        <div style={{ fontSize: 12, fontWeight: 500, color: N.black, letterSpacing: "0.04em" }}>{name}</div>
        <div style={{ fontSize: 10, color: N.grey2, marginTop: 2, letterSpacing: "0.03em" }}>{role}</div>
        <div style={{ fontSize: 10, color: N.grey2, marginTop: 2, display: "flex", alignItems: "center", gap: 3 }}>
          <Icon name="map-pin" size={10} color={N.grey2} />
          {location}
        </div>
      </div>
      <span style={{ marginLeft: "auto", fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", color: N.grey2, whiteSpace: "nowrap", alignSelf: "flex-start" }}>Read story</span>
    </div>
    <p style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 15, fontStyle: "italic", color: N.grey1, lineHeight: 1.75, paddingLeft: 12, borderLeft: `2px solid ${N.grey3}` }}>
      "{quote}"
    </p>
  </div>
);

// ─── PRODUCT DATASET (shared by looks carousel + swipe deck) ─────────────────
const PRODUCTS = [
  { name: "Valley Vase", price: 4600, tags: ["Terracotta", "Dining", "Aluminium"] },
  { name: "Indigo Dinner Plates", price: 3290, tags: ["Block print", "Dining"] },
  { name: "Brass Taper Candles", price: 2190, tags: ["Brass", "Ambient"] },
  { name: "Rattan Wall Mirror", price: 4490, tags: ["Rattan", "Living room"] },
  { name: "Nadi Vase", price: 3190, tags: ["Terracotta", "Dining"] },
  { name: "Palm Mug", price: 1890, tags: ["Hand-glazed", "Dining"] },
  { name: "Diya Set", price: 1490, tags: ["Brass", "Ambient"] },
  { name: "Clay Tea Pot", price: 2890, tags: ["Terracotta", "Dining"] },
  { name: "Chai Cups ×4", price: 2290, tags: ["Terracotta", "Dining"] },
  { name: "Spice Jar Set", price: 1490, tags: ["Rattan", "Living room"] },
];

const STYLED_LOOKS = [
  { title: "The Monsoon Table", meta: "Monsoon 25 · Dining · 4 pieces", tags: ["Terracotta", "Hand-thrown", "Dining"], price: "₹8,490 for the set" },
  { title: "Still Evening", meta: "Perennial · Living room · 3 pieces", tags: ["Brass", "Hand-glazed", "Ambient"], price: "₹6,290 for the set" },
  { title: "Morning Ritual", meta: "Everyday · Dining · 5 pieces", tags: ["Clay", "Warm", "Breakfast"], price: "₹5,190 for the set" },
];

// ─── STYLED LOOKS CAROUSEL (editorial, full-bleed, before the plain grid) ────
const StyledLooksCarousel = ({ go }) => (
  <div style={{ padding: "4px 0 8px" }}>
    <div style={{ padding: "0 16px", marginBottom: 12 }}>
      <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, color: N.black, marginBottom: 2 }}>Styled looks</div>
      <div style={{ fontSize: 11, color: N.grey2, letterSpacing: "0.02em" }}>Full rooms, styled by us — shop the whole scene</div>
    </div>
    <div style={{ display: "flex", gap: 10, overflowX: "auto", padding: "0 16px 6px", scrollSnapType: "x mandatory" }}>
      {STYLED_LOOKS.map((look) => (
        <div
          key={look.title}
          onClick={() => go("product")}
          style={{ position: "relative", flexShrink: 0, width: "82%", aspectRatio: "3/4", cursor: "pointer", scrollSnapAlign: "start", overflow: "hidden" }}
        >
          <Placeholder w="100%" h="100%" label={look.title + " — styled scene"} style={{ position: "absolute", inset: 0 }} />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.05) 55%, transparent 100%)" }} />
          <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: 16 }}>
            <div style={{ fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase", color: "rgba(255,255,255,0.7)", marginBottom: 4 }}>{look.meta}</div>
            <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, color: N.white, marginBottom: 8 }}>{look.title}</div>
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 10 }}>
              {look.tags.map((t) => (
                <span key={t} style={{ fontSize: 8, letterSpacing: "0.1em", textTransform: "uppercase", border: "0.5px solid rgba(255,255,255,0.5)", padding: "3px 8px", color: "rgba(255,255,255,0.9)" }}>{t}</span>
              ))}
            </div>

// ─── SWIPE DECK (Tinder-style like / skip for taste-based recommendations) ──
const SwipeDeck = ({ go, cardW = 300, cardH = 380 }) => {
  const [index, setIndex] = useState(0);
  const [drag, setDrag] = useState({ dragging: false, startX: 0, dx: 0 });
  const [liked, setLiked] = useState([]);
  const [passed, setPassed] = useState([]);

  const deck = PRODUCTS;
  const done = index >= deck.length;

  const commit = (direction) => {
    const item = deck[index];
    if (direction === "like") setLiked((l) => [...l, item]);
    else setPassed((p) => [...p, item]);
    setDrag({ dragging: false, startX: 0, dx: 0 });
    setIndex((i) => i + 1);
  };

  const onDown = (e) => {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setDrag({ dragging: true, startX: x, dx: 0 });
  };
  const onMove = (e) => {
    if (!drag.dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setDrag((d) => ({ ...d, dx: x - d.startX }));
  };
  const onUp = () => {
    if (!drag.dragging) return;
    if (drag.dx > 90) commit("like");
    else if (drag.dx < -90) commit("dislike");
    else setDrag({ dragging: false, startX: 0, dx: 0 });
  };

  const recommendations = () => {
    if (liked.length === 0) return deck.slice(0, 4);
    const likedTags = new Set(liked.flatMap((p) => p.tags));
    return deck
      .filter((p) => !liked.includes(p) && p.tags.some((t) => likedTags.has(t)))
      .slice(0, 4);
  };

  if (done) {
    const recs = recommendations();
    return (
      <div style={{ padding: "8px 16px 24px", textAlign: "center" }}>
        <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, marginBottom: 6 }}>You liked {liked.length} of {deck.length}</div>
        <p style={{ fontSize: 11, color: N.grey1, lineHeight: 1.7, marginBottom: 18 }}>Here's what we'd recommend based on your taste</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, textAlign: "left" }}>
          {recs.map((p) => (
            <div key={p.name} onClick={() => go("product")} style={{ cursor: "pointer" }}>
              <Placeholder aspect="1/1" label={p.name} />
              <div style={{ fontSize: 11, color: N.black, marginTop: 6 }}>{p.name}</div>
              <div style={{ fontSize: 10, color: N.grey2, marginTop: 2 }}>₹{p.price.toLocaleString("en-IN")}</div>
            </div>
          ))}
        </div>
        <BtnOutline style={{ marginTop: 18 }} onClick={() => { setIndex(0); setLiked([]); setPassed([]); }}>Swipe again</BtnOutline>
      </div>
    );
  }

  const rotate = drag.dx / 18;
  const likeOpacity = Math.min(Math.max(drag.dx / 90, 0), 1);
  const passOpacity = Math.min(Math.max(-drag.dx / 90, 0), 1);

  return (
    <div style={{ padding: "8px 16px 24px" }}>
      <div style={{ textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 20 }}>Swipe for your style</div>
        <div style={{ fontSize: 10, color: N.grey2, marginTop: 2 }}>{index + 1} of {deck.length} · Swipe right to like, left to skip</div>
      </div>
      <div style={{ position: "relative", width: cardW, height: cardH, margin: "0 auto" }}>
        {deck.slice(index, index + 3).reverse().map((p, revI) => {
          const stackI = deck.slice(index, index + 3).length - 1 - revI;
          const isTop = stackI === 0;
          return (
            <div
              key={p.name}
              onMouseDown={isTop ? onDown : undefined}
              onMouseMove={isTop ? onMove : undefined}
              onMouseUp={isTop ? onUp : undefined}
              onMouseLeave={isTop ? onUp : undefined}
              onTouchStart={isTop ? onDown : undefined}
              onTouchMove={isTop ? onMove : undefined}
              onTouchEnd={isTop ? onUp : undefined}
              style={{
                position: "absolute", inset: 0,
                transform: isTop
                  ? `translateX(${drag.dx}px) rotate(${rotate}deg)`
                  : `scale(${1 - stackI * 0.04}) translateY(${stackI * 10}px)`,
                transition: drag.dragging ? "none" : "transform 0.25s ease",
                cursor: isTop ? "grab" : "default",
                zIndex: 10 - stackI,
                touchAction: "none",
              }}
            >
              <div style={{ position: "relative", width: "100%", height: "100%", background: N.white, border: `1px solid ${N.grey4}`, overflow: "hidden" }}>
                <Placeholder w="100%" h="72%" label={p.name} />
                <div style={{ padding: 14 }}>
                  <div style={{ fontSize: 14, color: N.black }}>{p.name}</div>
                  <div style={{ fontSize: 12, color: N.grey2, marginTop: 4 }}>₹{p.price.toLocaleString("en-IN")}</div>
                  <div style={{ display: "flex", gap: 4, marginTop: 8, flexWrap: "wrap" }}>
                    {p.tags.map((t) => (
                      <span key={t} style={{ fontSize: 8, letterSpacing: "0.08em", textTransform: "uppercase", border: `0.5px solid ${N.grey3}`, padding: "2px 6px", color: N.grey2 }}>{t}</span>
                    ))}
                  </div>
                </div>
                {isTop && (
                  <>
                    <div style={{ position: "absolute", top: 16, left: 16, border: "3px solid #2e7d32", color: "#2e7d32", fontSize: 16, fontWeight: 700, padding: "3px 10px", transform: "rotate(-14deg)", letterSpacing: "0.08em", opacity: likeOpacity }}>LIKE</div>
                    <div style={{ position: "absolute", top: 16, right: 16, border: "3px solid #c0392b", color: "#c0392b", fontSize: 16, fontWeight: 700, padding: "3px 10px", transform: "rotate(14deg)", letterSpacing: "0.08em", opacity: passOpacity }}>SKIP</div>
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 20, justifyContent: "center", marginTop: 20 }}>
        <button onClick={() => commit("dislike")} style={{ width: 52, height: 52, borderRadius: "50%", border: `1px solid ${N.grey3}`, background: N.white, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c0392b" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
        <button onClick={() => commit("like")} style={{ width: 52, height: 52, borderRadius: "50%", border: "none", background: N.black, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="heart" size={20} color={N.white} />
        </button>
      </div>
    </div>
  );
};

            <button
              key={s}
              onClick={() => go(s)}
              style={{
                padding: "5px 10px", fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase",
                border: `1px solid ${screen === s ? "#1a1a1a" : "#ccc"}`,
