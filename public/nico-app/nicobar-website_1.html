<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nicobar Home — Website Prototype</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/plain" id="app-source">
const { useState, useRef } = React;

// ─── DESIGN TOKENS (live-inspected from nicobar.com, July 2026) ────────────
// Real fonts: EuclidFlex (sans) for all UI/body/prices; NewParisText / Butler
//   (serif) for warm editorial headlines. Both are Nicobar's own licensed
//   CDN-hosted fonts, not on Google Fonts — standing in with the closest
//   free equivalents: Inter (sans) + Fraunces (serif).
// Colors: near-black text rgb(28,27,27), no brand accent color — the sale
//   campaign's bright pink/orange/teal/purple circles are not brand tokens.
const FONT_URL =
  "https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap";

const N = {
  white: "#FFFFFF",
  black: "#1c1b1b",
  grey1: "#4a4a4a",
  grey2: "#888888",
  grey3: "#bbbbbb",
  grey4: "#e8e8e8",
  grey5: "#f5f5f5",
  grey6: "#f0f0f0",
  cream: "#faf7f2",
  creamDark: "#f0ebe1",
};

const globalStyle = `
@import url('${FONT_URL}');
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: ${N.cream}; color: ${N.black}; }
input, button, select, textarea { font-family: 'Inter', sans-serif; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: ${N.grey3}; }
.nic-grid { display: grid; gap: 24px; grid-template-columns: repeat(4, 1fr); }
.nic-grid-2 { display: grid; gap: 24px; grid-template-columns: repeat(2, 1fr); }
@media (max-width: 980px) { .nic-grid { grid-template-columns: repeat(2, 1fr); } .nic-grid-2 { grid-template-columns: 1fr; } .nic-hide-mobile { display: none; } .nic-checkout-cols, .nic-cart-cols, .nic-product-cols, .nic-room-cols { grid-template-columns: 1fr !important; } }
`;

// ─── PLACEHOLDER IMAGE ──────────────────────────────────────────────────────
// ─── PHOTO LIBRARY (real Nicobar CDN photography, keyed by Placeholder label) ─
// Sourced live from nicobar.com product/decor pages. Portraits (maker, member
// avatars) and the "your room" AR slot are deliberately left as placeholders —
// those represent specific fictional people or the user's own photo, and
// shouldn't be filled with a real stranger's likeness.
const PHOTO_LIBRARY = {
  "Valley Vase": "https://www.nicobar.com/cdn/shop/files/NBI035851_1.jpg",
  "Indigo Dinner Plates": "https://www.nicobar.com/cdn/shop/files/NBI034645_9_255c3bd7-9d72-4bf6-86e3-b5a94a99f1f4.jpg",
  "Indigo Plates": "https://www.nicobar.com/cdn/shop/files/NBI034645_9_255c3bd7-9d72-4bf6-86e3-b5a94a99f1f4.jpg",
  "Brass Taper Candles": "https://www.nicobar.com/cdn/shop/files/Decor_Votives_260626.jpg",
  "Taper Candles": "https://www.nicobar.com/cdn/shop/files/Decor_Votives_260626.jpg",
  "Brass Taper Candle Set": "https://www.nicobar.com/cdn/shop/files/Decor_Votives_260626.jpg",
  "Rattan Wall Mirror": "https://www.nicobar.com/cdn/shop/files/NBI033651_1_1200x.jpg",
  "Rattan Mirror": "https://www.nicobar.com/cdn/shop/files/NBI033651_1_1200x.jpg",
  "Nadi Vase": "https://www.nicobar.com/cdn/shop/files/NBI016416_1_1200x.jpg",
  "Palm Mug": "https://www.nicobar.com/cdn/shop/files/NBI048972_1_1200x.jpg",
  "Diya Set": "https://www.nicobar.com/cdn/shop/files/NBI037675_5_1200x.jpg",
  "Clay Tea Pot": "https://www.nicobar.com/cdn/shop/files/NBI020672_5.jpg",
  "Chai Cups ×4": "https://www.nicobar.com/cdn/shop/files/NBI020672_5.jpg",
  "Spice Jar Set": "https://www.nicobar.com/cdn/shop/files/NBI037678_2.jpg",
  "Hero — Nicobar home collection campaign image": "https://www.nicobar.com/cdn/shop/files/home_styling.jpg",
  "Nicobar home collection campaign image": "https://www.nicobar.com/cdn/shop/files/NBI035851_1.jpg",
  "Valley Vase — main product photo": "https://www.nicobar.com/cdn/shop/files/NBI035851_1.jpg",
  "View 1": "https://www.nicobar.com/cdn/shop/files/NBI035851_1.jpg",
  "View 2": "https://www.nicobar.com/cdn/shop/files/NBI035851_2_1200x.jpg",
  "View 3": "https://www.nicobar.com/cdn/shop/files/NBI035851_3.jpg",
  "View 4": "https://www.nicobar.com/cdn/shop/files/NBI016416_1_1200x.jpg",
  "Dining": "https://www.nicobar.com/cdn/shop/files/NBI034638_1_700x.jpg",
  "Living room": "https://www.nicobar.com/cdn/shop/files/home_styling.jpg",
  "Bedroom": "https://www.nicobar.com/cdn/shop/files/NBI037511_1.jpg",
  "Gifting": "https://www.nicobar.com/cdn/shop/files/Curatedmugs.jpg",
};

const Placeholder = ({ w, h, label = "", style = {}, aspect }) => {
  const photo = PHOTO_LIBRARY[label];
  if (photo) {
    return (
      <img
        src={photo}
        alt={label}
        style={{
          width: w || "100%", height: h, aspectRatio: aspect, objectFit: "cover",
          flexShrink: 0, display: "block", ...style,
        }}
      />
    );
  }
  return (
    <div
      style={{
        width: w || "100%", height: h, aspectRatio: aspect, background: N.grey6,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        flexShrink: 0, ...style,
      }}
    >
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke={N.grey3} strokeWidth="1.2">
        <rect x="3" y="3" width="18" height="18" rx="1" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
      {label && (
        <span style={{ fontSize: 10, color: N.grey3, marginTop: 6, letterSpacing: "0.08em", textTransform: "uppercase", textAlign: "center", padding: "0 12px" }}>
          {label}
        </span>
      )}
    </div>
  );
};

// Real wordmark: thin geometric sans, wide tracking — the "O" in NICOBAR is
// replaced by a small circle sitting on a wave squiggle (an ocean motif).
const NicobarLogo = ({ size = 22, color = N.black }) => {
  const dot = size * 0.62;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", fontFamily: "'Inter', sans-serif", fontWeight: 300, fontSize: size, letterSpacing: "0.18em", color, textTransform: "uppercase", userSelect: "none" }}>
      NIC
      <span style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: dot, margin: `0 ${size * 0.06}px` }}>
        <span style={{ width: dot * 0.7, height: dot * 0.7, borderRadius: "50%", border: `${Math.max(1, size * 0.07)}px solid ${color}`, marginBottom: dot * 0.1 }} />
        <svg width={dot * 0.85} height={dot * 0.32} viewBox="0 0 20 8">
          <path d="M1 4 Q5 0.5 10 4 T19 4" fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      </span>
      BAR
    </span>
  );
};

// ─── ICONS ──────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 20, color = N.black, onClick, style = {} }) => {
  const paths = {
    "arrow-left": <polyline points="15 18 9 12 15 6" />,
    menu: <><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></>,
    bag: <><path d="M6 2 L3 6 v14 a2 2 0 0 0 2 2 h14 a2 2 0 0 0 2-2 V6 l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" /></>,
    heart: <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />,
    search: <><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>,
    share: <><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" /><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></>,
    camera: <><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></>,
    "map-pin": <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></>,
    check: <polyline points="20 6 9 17 4 12" />,
    star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
    trash: <><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></>,
    gift: <><polyline points="20 12 20 22 4 22 4 12" /><rect x="2" y="7" width="20" height="5" /><line x1="12" y1="22" x2="12" y2="7" /><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" /><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" /></>,
    sparkle: <path d="M12 3 L13.5 9 L20 9 L14.5 13 L16.5 20 L12 16 L7.5 20 L9.5 13 L4 9 L10.5 9 Z" />,
    home: <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></>,
    user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
    minus: <line x1="5" y1="12" x2="19" y2="12" />,
    plus: <><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>,
    "chevron-right": <polyline points="9 18 15 12 9 6" />,
    "chevron-down": <polyline points="6 9 12 15 18 9" />,
    upload: <><polyline points="16 16 12 12 8 16" /><line x1="12" y1="12" x2="12" y2="21" /><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" /></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" onClick={onClick} style={{ cursor: onClick ? "pointer" : "default", flexShrink: 0, ...style }}>
      {paths[name]}
    </svg>
  );
};

// ─── SHARED UI ──────────────────────────────────────────────────────────────
const BtnPrimary = ({ children, onClick, style = {} }) => (
  <button onClick={onClick} style={{ padding: "15px 32px", background: N.black, color: N.white, border: "none", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 500, fontFamily: "'Inter', sans-serif", ...style }}>
    {children}
  </button>
);

const BtnOutline = ({ children, onClick, style = {} }) => (
  <button onClick={onClick} style={{ padding: "14px 32px", background: N.white, color: N.black, border: `1px solid ${N.black}`, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 500, fontFamily: "'Inter', sans-serif", ...style }}>
    {children}
  </button>
);

const Input = ({ label, ...props }) => (
  <div style={{ marginBottom: 16 }}>
    {label && <div style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: N.grey2, marginBottom: 7 }}>{label}</div>}
    <input {...props} style={{ width: "100%", padding: "14px 16px", border: `1px solid ${N.grey4}`, fontSize: 13, color: N.black, outline: "none", background: N.white, fontFamily: "'Inter', sans-serif", letterSpacing: "0.02em" }} />
  </div>
);

const SectionLabel = ({ children, style = {} }) => (
  <div style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: N.grey2, marginBottom: 14, ...style }}>{children}</div>
);

const Divider = () => <div style={{ height: 1, background: N.grey4, margin: "0" }} />;

const OtpBoxes = ({ values = ["8", "4", "2", ""] }) => (
  <div style={{ display: "flex", gap: 12, margin: "26px 0" }}>
    {values.map((v, i) => (
      <div key={i} style={{ width: 56, height: 60, border: `1px solid ${v ? N.black : N.grey4}`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Fraunces', serif", fontSize: 26, color: N.black, background: v ? N.white : N.grey5 }}>
        {v}
      </div>
    ))}
  </div>
);

const ChipFilter = ({ options, active, onChange }) => (
  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 28 }}>
    {options.map((o) => (
      <button key={o} onClick={() => onChange(o)} style={{ padding: "9px 18px", border: `1px solid ${active === o ? N.black : N.grey4}`, background: active === o ? N.black : N.white, color: active === o ? N.white : N.grey1, fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", fontFamily: "'Inter', sans-serif" }}>
        {o}
      </button>
    ))}
  </div>
);

const StepProgress = ({ current }) => (
  <div style={{ display: "flex", alignItems: "center", margin: "0 0 32px", maxWidth: 480 }}>
    {["Cart", "Address & Payment", "Confirmed"].map((s, i) => (
      <div key={i} style={{ display: "flex", alignItems: "center", flex: i < 2 ? 1 : 0 }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
          <div style={{ width: 28, height: 28, borderRadius: "50%", background: i <= current ? N.black : N.white, border: i > current ? `1px solid ${N.grey4}` : "none", display: "flex", alignItems: "center", justifyContent: "center", color: i <= current ? N.white : N.grey3, fontSize: 11, fontWeight: 500 }}>
            {i < current ? <Icon name="check" size={13} color={N.white} /> : <span>{i + 1}</span>}
          </div>
          <span style={{ fontSize: 9, letterSpacing: "0.08em", textTransform: "uppercase", color: i <= current ? N.black : N.grey3, whiteSpace: "nowrap" }}>{s}</span>
        </div>
        {i < 2 && <div style={{ flex: 1, height: 1, background: i < current ? N.black : N.grey4, margin: "0 10px", marginBottom: 20 }} />}
      </div>
    ))}
  </div>
);

const MakerCard = ({ name, role, location, quote, go }) => (
  <div onClick={() => go("maker")} style={{ border: `1px solid ${N.grey4}`, padding: 24, cursor: "pointer" }}>
    <SectionLabel>From the maker</SectionLabel>
    <div style={{ display: "flex", gap: 14, marginBottom: 16 }}>
      <Placeholder w={52} h={52} style={{ borderRadius: "50%", flexShrink: 0 }} />
      <div>
        <div style={{ fontSize: 13, fontWeight: 500, color: N.black, letterSpacing: "0.04em" }}>{name}</div>
        <div style={{ fontSize: 11, color: N.grey2, marginTop: 2, letterSpacing: "0.03em" }}>{role}</div>
        <div style={{ fontSize: 11, color: N.grey2, marginTop: 2, display: "flex", alignItems: "center", gap: 4 }}>
          <Icon name="map-pin" size={11} color={N.grey2} /> {location}
        </div>
      </div>
      <span style={{ marginLeft: "auto", fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", color: N.grey2, whiteSpace: "nowrap", alignSelf: "flex-start" }}>Read story</span>
    </div>
    <p style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontStyle: "italic", color: N.grey1, lineHeight: 1.75, paddingLeft: 14, borderLeft: `2px solid ${N.grey3}` }}>
      "{quote}"
    </p>
  </div>
);

// ─── LAYOUT: TOP NAV + FOOTER ───────────────────────────────────────────────
const NAV_LINKS = [
  { id: "shop", label: "Shop" },
  { id: "swipe", label: "For You" },
  { id: "room", label: "My Room" },
  { id: "wishlist", label: "Wishlist" },
  { id: "orders", label: "Orders" },
];

const Container = ({ children, style = {} }) => (
  <div style={{ maxWidth: 1240, margin: "0 auto", padding: "0 32px", ...style }}>{children}</div>
);

const Banner = ({ text }) => (
  <div style={{ background: N.black, color: N.white, textAlign: "center", padding: "9px 16px", fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase" }}>
    {text}
  </div>
);

const TopNavBar = ({ go, page, cartCount = 3 }) => {
  const [q, setQ] = useState("");
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 50, background: N.white }}>
      <Banner text="Free shipping on orders above ₹1,000 · Monsoon 25 is here" />
      <div style={{ borderBottom: `1px solid ${N.grey4}` }}>
        <Container style={{ display: "flex", alignItems: "center", height: 76, gap: 32 }}>
          <div onClick={() => go("home")} style={{ cursor: "pointer" }}>
            <NicobarLogo />
          </div>
          <nav className="nic-hide-mobile" style={{ display: "flex", gap: 28, flex: 1 }}>
            {NAV_LINKS.map((l) => (
              <span
                key={l.id}
                onClick={() => go(l.id)}
                style={{
                  fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", cursor: "pointer",
                  color: page === l.id ? N.black : N.grey1,
                  borderBottom: page === l.id ? `1.5px solid ${N.black}` : "1.5px solid transparent",
                  paddingBottom: 4,
                }}
              >
                {l.label}
              </span>
            ))}
          </nav>
          <div style={{ flex: 1 }} className="nic-hide-mobile-spacer" />
          <div style={{ display: "flex", alignItems: "center", gap: 18, marginLeft: "auto" }}>
            <div className="nic-hide-mobile" style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${N.grey4}`, padding: "7px 12px", width: 190 }}>
              <Icon name="search" size={15} color={N.grey2} />
              <input
                value={q}
                onChange={(e) => setQ(e.target.value)}
                placeholder="Search products"
                style={{ border: "none", outline: "none", fontSize: 11, width: "100%", fontFamily: "'Inter', sans-serif", background: "transparent" }}
              />
            </div>
            <Icon name="heart" size={19} onClick={() => go("wishlist")} />
            <Icon name="user" size={19} onClick={() => go("account")} />
            <div style={{ position: "relative", cursor: "pointer" }} onClick={() => go("cart")}>
              <Icon name="bag" size={19} />
              {cartCount > 0 && (
                <span style={{ position: "absolute", top: -7, right: -8, background: N.black, color: N.white, fontSize: 9, width: 16, height: 16, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {cartCount}
                </span>
              )}
            </div>
          </div>
        </Container>
      </div>
    </div>
  );
};

const Footer = ({ go }) => (
  <footer style={{ background: N.black, color: N.grey4, marginTop: 80 }}>
    <Container style={{ padding: "56px 32px 32px", display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr 1.2fr", gap: 32 }}>
      <div>
        <NicobarLogo color={N.white} />
        <p style={{ fontSize: 12, color: N.grey3, lineHeight: 1.8, marginTop: 16, maxWidth: 280 }}>
          Dining and decor curated for the way you actually live — handcrafted by makers across India.
        </p>
      </div>
      <div>
        <SectionLabel style={{ color: N.grey3 }}>Shop</SectionLabel>
        {["Dining", "Living room", "New in", "Under ₹5k"].map((l) => (
          <div key={l} onClick={() => go("shop")} style={{ fontSize: 12, color: N.grey4, marginBottom: 10, cursor: "pointer" }}>{l}</div>
        ))}
      </div>
      <div>
        <SectionLabel style={{ color: N.grey3 }}>Account</SectionLabel>
        {[["Orders", "orders"], ["Wishlist", "wishlist"], ["My Room", "room"], ["Sign in", "login"]].map(([l, id]) => (
          <div key={l} onClick={() => go(id)} style={{ fontSize: 12, color: N.grey4, marginBottom: 10, cursor: "pointer" }}>{l}</div>
        ))}
      </div>
      <div>
        <SectionLabel style={{ color: N.grey3 }}>Stay in touch</SectionLabel>
        <p style={{ fontSize: 12, color: N.grey3, lineHeight: 1.7, marginBottom: 14 }}>Sign up for style notes and early access to new drops.</p>
        <div style={{ display: "flex", border: `1px solid ${N.grey1}` }}>
          <input placeholder="Email address" style={{ flex: 1, background: "transparent", border: "none", padding: "11px 12px", color: N.white, fontSize: 12, outline: "none" }} />
          <button style={{ background: N.white, color: N.black, border: "none", padding: "0 16px", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase" }}>Join</button>
        </div>
      </div>
    </Container>
    <div style={{ borderTop: `1px solid #333`, padding: "18px 32px", textAlign: "center", fontSize: 10, color: N.grey2, letterSpacing: "0.08em" }}>
      Nicobar Design Pvt. Ltd. © 2025 — Image placeholders shown, replace with Nicobar photography
    </div>
  </footer>
);

const PageShell = ({ go, page, children, hideNav = false }) => (
  <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
    <style>{globalStyle}</style>
    {!hideNav && <TopNavBar go={go} page={page} />}
    <div style={{ flex: 1 }}>{children}</div>
    {!hideNav && <Footer go={go} />}
  </div>
);

// ════════════════════════════════════════════════════════════════════════════
// PAGES
// ════════════════════════════════════════════════════════════════════════════

const HomePage = ({ go }) => (
  <PageShell go={go} page="home">

// ─── SWIPE DECK (Tinder-style like / skip for taste-based recommendations) ──
// ─── STYLE BRIEF (derived from the tags on liked pieces after a swipe run) ──
const STYLE_PROFILES = [
  { tag: "Terracotta", title: "Warm & Earthy", blurb: "Terracotta and hand-thrown texture kept catching your eye — you like a table that feels grounded, sun-baked, a little imperfect." },
  { tag: "Brass", title: "Moody & Ambient", blurb: "Brass and soft firelight came up again and again — you're building a room that glows after dark." },
  { tag: "Rattan", title: "Textured & Natural", blurb: "Rattan and woven texture stood out — natural materials, a relaxed, layered feel." },
  { tag: "Block print", title: "Pattern-Forward", blurb: "Bold block-printed pattern caught your eye — you like a table that makes a statement." },
  { tag: "Hand-glazed", title: "Handmade & Tactile", blurb: "Hand-glazed, one-of-a-kind pieces are your thing — nothing that looks mass-produced." },
];

function getStyleBrief(liked) {
  const fallback = { title: "Eclectic Explorer", blurb: "You kept an open mind across the board — a little bit of everything caught your interest.", tags: [] };
  if (liked.length === 0) return fallback;
  const counts = {};
  liked.forEach((p) => p.tags.forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
  const topTags = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([t]) => t);
  const profile = STYLE_PROFILES.find((sp) => counts[sp.tag] > 0);
  if (!profile) return { ...fallback, tags: topTags };
  return { title: profile.title, blurb: profile.blurb, tags: topTags };
}

const SwipeDeck = ({ go, cardW = 340, cardH = 440 }) => {
  const [index, setIndex] = useState(0);
  const [drag, setDrag] = useState({ dragging: false, startX: 0, dx: 0 });
  const [liked, setLiked] = useState([]);
  const [passed, setPassed] = useState([]);

  const deck = PRODUCTS;
  const done = index >= deck.length;

  const commit = (direction) => {
    const item = deck[index];
    if (direction === "like") setLiked((l) => [...l, item]);
    else setPassed((p) => [...p, item]);
    setDrag({ dragging: false, startX: 0, dx: 0 });
    setIndex((i) => i + 1);
  };

  const onDown = (e) => {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setDrag({ dragging: true, startX: x, dx: 0 });
  };
  const onMove = (e) => {
    if (!drag.dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setDrag((d) => ({ ...d, dx: x - d.startX }));
  };
  const onUp = () => {
    if (!drag.dragging) return;
    if (drag.dx > 110) commit("like");
    else if (drag.dx < -110) commit("dislike");
    else setDrag({ dragging: false, startX: 0, dx: 0 });
  };

  const recommendations = () => {
    if (liked.length === 0) return deck.slice(0, 4);
    const likedTags = new Set(liked.flatMap((p) => p.tags));
    return deck
      .filter((p) => !liked.includes(p) && p.tags.some((t) => likedTags.has(t)))
      .slice(0, 4);
  };

  if (done) {
    const recs = recommendations();
    const brief = getStyleBrief(liked);
    return (
      <div style={{ textAlign: "center", padding: "24px 0" }}>
        <div style={{ fontSize: 11, letterSpacing: "0.2em", textTransform: "uppercase", color: N.grey2, marginBottom: 6 }}>You liked {liked.length} of {deck.length}</div>

        <div style={{ border: `1px solid ${N.grey4}`, background: N.grey5, padding: "28px 32px", margin: "14px auto 32px", maxWidth: 560, textAlign: "left" }}>
          <div style={{ fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: N.grey2, marginBottom: 10 }}>Your style</div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 30, color: N.black, marginBottom: 10 }}>{brief.title}</div>
          <p style={{ fontSize: 13, color: N.grey1, lineHeight: 1.75, marginBottom: brief.tags.length ? 14 : 0 }}>{brief.blurb}</p>
          {brief.tags.length > 0 && (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {brief.tags.map((t) => (
                <span key={t} style={{ fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", border: `0.5px solid ${N.grey3}`, padding: "5px 11px", color: N.grey1 }}>{t}</span>
              ))}
            </div>
          )}
        </div>

        <p style={{ fontSize: 13, color: N.grey1, lineHeight: 1.7, marginBottom: 28 }}>Here's what we'd recommend based on your style</p>
        <div className="nic-grid" style={{ maxWidth: 900, margin: "0 auto", textAlign: "left" }}>
          {recs.map((p) => (
            <div key={p.name} onClick={() => go("product")} style={{ cursor: "pointer" }}>
              <Placeholder aspect="3/4" label={p.name} />
              <div style={{ fontSize: 13, marginTop: 10 }}>{p.name}</div>
              <div style={{ fontSize: 12, color: N.grey2, marginTop: 3 }}>₹{p.price.toLocaleString("en-IN")}</div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 28 }}>
          <BtnPrimary onClick={() => go("shop")} style={{ maxWidth: 240 }}>Explore curated looks</BtnPrimary>
          <BtnOutline onClick={() => { setIndex(0); setLiked([]); setPassed([]); }} style={{ maxWidth: 200 }}>Swipe again</BtnOutline>
        </div>
      </div>
    );
  }

  const rotate = drag.dx / 20;
  const likeOpacity = Math.min(Math.max(drag.dx / 110, 0), 1);
  const passOpacity = Math.min(Math.max(-drag.dx / 110, 0), 1);

  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 26 }}>Swipe for your style</div>
        <div style={{ fontSize: 12, color: N.grey2, marginTop: 4 }}>{index + 1} of {deck.length} · Drag right to like, left to skip</div>
      </div>
      <div style={{ position: "relative", width: cardW, height: cardH, margin: "0 auto" }}>
        {deck.slice(index, index + 3).reverse().map((p, revI) => {
          const stackI = deck.slice(index, index + 3).length - 1 - revI;
          const isTop = stackI === 0;
          return (
            <div
              key={p.name}
              onMouseDown={isTop ? onDown : undefined}
              onMouseMove={isTop ? onMove : undefined}
              onMouseUp={isTop ? onUp : undefined}
              onMouseLeave={isTop ? onUp : undefined}
              onTouchStart={isTop ? onDown : undefined}
              onTouchMove={isTop ? onMove : undefined}
              onTouchEnd={isTop ? onUp : undefined}
              style={{
                position: "absolute", inset: 0,
                transform: isTop
                  ? `translateX(${drag.dx}px) rotate(${rotate}deg)`
                  : `scale(${1 - stackI * 0.04}) translateY(${stackI * 12}px)`,
                transition: drag.dragging ? "none" : "transform 0.25s ease",
                cursor: isTop ? "grab" : "default",
                zIndex: 10 - stackI,
                touchAction: "none",
              }}
            >
              <div style={{ position: "relative", width: "100%", height: "100%", background: N.white, border: `1px solid ${N.grey4}`, overflow: "hidden", textAlign: "left" }}>
                <Placeholder w="100%" h="70%" label={p.name} />
                <div style={{ padding: 20 }}>
                  <div style={{ fontSize: 16 }}>{p.name}</div>
                  <div style={{ fontSize: 13, color: N.grey2, marginTop: 5 }}>₹{p.price.toLocaleString("en-IN")}</div>
                  <div style={{ display: "flex", gap: 5, marginTop: 10, flexWrap: "wrap" }}>
                    {p.tags.map((t) => (
                      <span key={t} style={{ fontSize: 9, letterSpacing: "0.08em", textTransform: "uppercase", border: `0.5px solid ${N.grey3}`, padding: "3px 8px", color: N.grey2 }}>{t}</span>
                    ))}
                  </div>
                </div>
                {isTop && (
                  <>
                    <div style={{ position: "absolute", top: 20, left: 20, border: "3px solid #2e7d32", color: "#2e7d32", fontSize: 18, fontWeight: 700, padding: "4px 12px", transform: "rotate(-14deg)", letterSpacing: "0.08em", opacity: likeOpacity }}>LIKE</div>
                    <div style={{ position: "absolute", top: 20, right: 20, border: "3px solid #c0392b", color: "#c0392b", fontSize: 18, fontWeight: 700, padding: "4px 12px", transform: "rotate(14deg)", letterSpacing: "0.08em", opacity: passOpacity }}>SKIP</div>
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 24, justifyContent: "center", marginTop: 28 }}>
        <button onClick={() => commit("dislike")} style={{ width: 56, height: 56, borderRadius: "50%", border: `1px solid ${N.grey3}`, background: N.white, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0392b" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
        <button onClick={() => commit("like")} style={{ width: 56, height: 56, borderRadius: "50%", border: "none", background: N.black, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="heart" size={22} color={N.white} />
        </button>
      </div>
    </div>
  );
};

// ─── MY ROOM PAGE ───────────────────────────────────────────────────────────
const RoomPage = ({ go }) => {
  const [sel, setSel] = useState("Valley Vase");
  const [roomPhoto, setRoomPhoto] = useState(null);
  const [placed, setPlaced] = useState([]);
  const fileInputRef = useRef(null);
  const pieces = ["Valley Vase", "Indigo Plates", "Taper Candles", "Rattan Mirror"];

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setRoomPhoto(URL.createObjectURL(file));
    setPlaced([]);
  };

  const onPhotoClick = (e) => {
    if (!roomPhoto) { fileInputRef.current && fileInputRef.current.click(); return; }
    const rect = e.currentTarget.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width) * 100;
    const yPct = ((e.clientY - rect.top) / rect.height) * 100;
    setPlaced((list) => [...list, { id: Date.now(), piece: sel, x: xPct, y: yPct }]);
  };

  const removePlaced = (id, ev) => {
    ev.stopPropagation();
    setPlaced((list) => list.filter((p) => p.id !== id));
  };

  return (
    <PageShell go={go} page="room">
      <input ref={fileInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onFile} />
      <Container style={{ padding: "40px 32px 64px" }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 32, marginBottom: 8 }}>My Room</div>
        <p style={{ fontSize: 13, color: N.grey1, marginBottom: 32, maxWidth: 520 }}>Upload a photo of your space, place any piece in it, and get an instant styling match.</p>
        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 40 }} className="nic-room-cols">
          <div>
            <SectionLabel>Your space</SectionLabel>
            <div style={{ border: `1px solid ${N.grey4}`, padding: 16, background: N.grey5 }}>
              <div style={{ fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: N.grey2, marginBottom: 12 }}>Living room — uploaded photo</div>
              <div onClick={onPhotoClick} style={{ position: "relative", width: "100%", aspectRatio: "16/9", cursor: "pointer", overflow: "hidden", background: N.grey6 }}>
                {roomPhoto ? (
                  <img src={roomPhoto} alt="Your room" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                ) : (
                  <Placeholder w="100%" h="100%" label="Your room photo will appear here — tap to place pieces" />
                )}
                {placed.map((p) => (
                  <img
                    key={p.id}
                    src={PHOTO_LIBRARY[p.piece]}
                    alt={p.piece}
                    onClick={(ev) => removePlaced(p.id, ev)}
                    title="Click to remove"
                    style={{
                      position: "absolute", left: `${p.x}%`, top: `${p.y}%`, transform: "translate(-50%, -50%)",
                      width: 72, height: 72, objectFit: "cover", borderRadius: "50%",
                      border: `2px solid ${N.white}`, boxShadow: "0 6px 18px rgba(0,0,0,0.35)", cursor: "pointer",
                    }}
                  />
                ))}
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                {["Retake", "Upload new"].map((l) => (
                  <button key={l} onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ padding: "9px 16px", border: `1px solid ${N.grey4}`, background: N.white, fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", fontFamily: "'Inter', sans-serif", color: N.grey1, display: "flex", alignItems: "center", gap: 6 }}>
                    <Icon name={l === "Retake" ? "camera" : "upload"} size={12} color={N.grey2} /> {l}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div>
            <SectionLabel>Place a piece</SectionLabel>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10, marginBottom: 20 }}>
              {pieces.map((p) => (
                <div key={p} onClick={() => setSel(p)} style={{ border: `1px solid ${sel === p ? N.black : N.grey4}`, cursor: "pointer" }}>
                  <Placeholder aspect="1/1" label={p} />
                  <div style={{ padding: "7px 8px", fontSize: 10, letterSpacing: "0.04em", lineHeight: 1.3 }}>{p}</div>
                </div>
              ))}
            </div>
            <p style={{ fontSize: 13, color: N.grey1, lineHeight: 1.7, marginBottom: 16 }}>
              {roomPhoto ? (
                <><strong style={{ fontWeight: 500, color: N.black }}>{sel}</strong> selected — tap your room photo to place it. {placed.length > 0 ? `${placed.length} placed — click a piece on the photo to remove it.` : ""}</>
              ) : (
                <><strong style={{ fontWeight: 500, color: N.black }}>{sel}</strong> selected — click the box to upload a photo of your room, then click on it to place this piece.</>
              )}
            </p>
            <div style={{ border: `1px solid ${N.grey4}`, padding: "14px 16px", marginBottom: 20, background: N.grey5 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <span style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: N.grey2 }}>Decor harmony</span>
                <span style={{ fontSize: 14, fontWeight: 500 }}>92%</span>
              </div>
              <div style={{ height: 4, background: N.grey4, marginBottom: 12 }}><div style={{ width: "92%", height: "100%", background: N.black }} /></div>
              <p style={{ fontSize: 12, color: N.grey1, lineHeight: 1.7 }}>Warm tones in your living room pair naturally with this piece — a grounded addition to the corner shelf.</p>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <BtnPrimary onClick={() => go("cart")} style={{ flex: 1 }}>Add to bag</BtnPrimary>
              <BtnOutline onClick={() => go("wishlist")} style={{ flex: 1 }}>Wishlist</BtnOutline>
            </div>
          </div>
        </div>
      </Container>
    </PageShell>
  );
};

const PAGE_REGISTRY = {
  home: HomePage,
  login: LoginPage,
  forgot: ForgotPage,
  found: FoundPage,
  otp: OtpPage,
  shop: ShopPage,
  swipe: SwipePage,
  product: ProductPage,
  maker: MakerPage,
  room: RoomPage,
  wishlist: WishlistPage,
  orders: OrdersPage,
  cart: CartPage,
  checkout: CheckoutPage,
  confirmed: ConfirmedPage,
  account: AccountPage,
};

const PAGE_LABELS = Object.keys(PAGE_REGISTRY);

function NicobarWebsite() {
  const [page, setPage] = useState("home");
  const go = (p) => {
    setPage(p);
    window.scrollTo(0, 0);
  };
  const Page = PAGE_REGISTRY[page] || HomePage;

  return (
    <div>
      {/* Dev-only page switcher, mimics a browser's address bar for quick navigation between pages */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 100, background: "#111", padding: "8px 16px", display: "flex", gap: 4, flexWrap: "wrap", justifyContent: "center" }}>
        {PAGE_LABELS.map((p) => (
          <button
            key={p}
            onClick={() => go(p)}
            style={{
              padding: "5px 10px", fontSize: 9, letterSpacing: "0.08em", textTransform: "uppercase",
              border: `1px solid ${page === p ? "#fff" : "#444"}`,
              background: page === p ? "#fff" : "transparent",
              color: page === p ? "#111" : "#999",
              fontFamily: "'Inter', sans-serif", cursor: "pointer",
            }}
          >
            {p}
          </button>
        ))}
      </div>
      <div style={{ paddingBottom: 44 }}>
        <Page go={go} />
      </div>
    </div>
  );
}
